services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-rpg}
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  app:
    build: .
    env_file: .env
    environment:
      PORT: ${PORT:-3000}
      SESSION_TTL_SECONDS: "${SESSION_TTL_SECONDS-604800}"
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    networks:
      - default
      - database
    depends_on:
      postgres:
        condition: service_healthy
    init: true

volumes:
  database:

networks:
  database:
    internal: true
